name: GPU RDP

on:
  workflow_dispatch:

jobs:
  gpu-rdp:
    # Reemplaza "TU-LABEL-GPU" por la etiqueta exacta
    # que tenga tu larger runner con Tesla T4.
    runs-on:
      labels: TU-LABEL-GPU

    timeout-minutes: 3600

    steps:

      - name: Check GPU
        shell: bash
        run: |
          echo "=== GPU ==="
          nvidia-smi || true

          echo ""
          echo "=== CPU ==="
          lscpu | head -20

          echo ""
          echo "=== RAM ==="
          free -h

      - name: Install NVIDIA tools
        shell: bash
        run: |
          nvidia-smi || true

      - name: Test CUDA
        shell: bash
        run: |
          echo "Checking NVIDIA GPU..."
          nvidia-smi

          echo ""
          echo "CUDA information:"
          nvidia-smi --query-gpu=name,memory.total,driver_version \
            --format=csv

      - name: Keep runner alive
        shell: bash
        run: |
          while true; do
            echo "[$(date)] GPU runner active"
            nvidia-smi
            sleep 300
          done
