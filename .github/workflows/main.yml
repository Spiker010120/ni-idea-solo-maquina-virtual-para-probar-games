name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # CONFIGURAR ACELERACION GRAFICA PARA RDP
      # ============================================================
      - name: Configure RDP Graphics
        shell: powershell
        run: |
          Write-Host "=== Configurando aceleracion grafica ==="

          $rdpPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          if (-not (Test-Path $rdpPolicy)) {
              New-Item -Path $rdpPolicy -Force | Out-Null
          }

          # Usar adaptador grafico de hardware para RDP
          New-ItemProperty `
            -Path $rdpPolicy `
            -Name "UseHardwareGraphicsAdapters" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          # Preferir H.264/AVC
          New-ItemProperty `
            -Path $rdpPolicy `
            -Name "AVC444ModePreferred" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          # Preferir codificacion H.264 mediante hardware
          New-ItemProperty `
            -Path $rdpPolicy `
            -Name "AVCHardwareEncodePreferred" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          Write-Host ""
          Write-Host "=== GRAFICA DETECTADA ==="

          Get-CimInstance Win32_VideoController |
            Select-Object Name, VideoProcessor, DriverVersion, AdapterRAM |
            Format-Table -AutoSize

      # ============================================================
      # CONFIGURAR RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

      # ============================================================
      # CREAR USUARIO RDP
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      # ============================================================
      # INSTALAR TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      # ============================================================
      # CONECTAR TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ============================================================
      # VERIFICAR RDP
      # ============================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      # ============================================================
      # MOSTRAR INFORMACION
      # ============================================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP ACCESS"
          Write-Host "======================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "=== GRAFICA DE LA MAQUINA ==="

          Get-CimInstance Win32_VideoController |
            Select-Object Name, VideoProcessor, DriverVersion, AdapterRAM |
            Format-Table -AutoSize

      # ============================================================
      # MANTENER LA MAQUINA ACTIVA
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"

              Get-CimInstance Win32_VideoController |
                Select-Object Name, DriverVersion |
                Format-Table -AutoSize

              Start-Sleep -Seconds 300
          }
